use_default_settings:
  engines:
    keep_only: [google, bing, duckduckgo, brave, baidu, wikipedia]
general:
  debug: false
  instance_name: ForSLM Search
search:
  formats: [html, json]
  autocomplete: ''
server:
  bind_address: 127.0.0.1
  port: 8888
  secret_key: REPLACE_ON_FIRST_START
  limiter: false
outgoing:
  request_timeout: 8.0
engines:
  - name: bing
    disabled: false
    base_url: https://cn.bing.com
  - name: baidu
    disabled: false
  - name: wikipedia
    display_type: [infobox, list]
